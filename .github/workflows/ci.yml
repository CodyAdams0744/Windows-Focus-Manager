name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import main, window_manager, config, config_io, tray, focus_outline, settings_window; print('imports OK')"

      - name: Config validation sanity
        run: |
          python -c "import config; c = config.as_dict(); assert 0.0 < c['EXPAND_RATIO'] < 1.0; assert c['LAYOUT_MODE'] in ('auto', 'strip', 'quadrant', 'triptych', 'fgrid'); assert c['POLL_INTERVAL_MS'] > 0; print('config OK')"
